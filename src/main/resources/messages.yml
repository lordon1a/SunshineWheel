# SunshineWheel messages (English, default).
# Placeholders like {player} are replaced automatically. MiniMessage tags allowed.
# Set "language: tr" in config.yml to use messages_tr.yml instead.
spin:
  cooldown: "<red>Please wait {seconds} seconds to spin this wheel again."
  disabled: "<red>This wheel is currently disabled."
  no-permission: "<red>You do not have permission to spin this wheel."
  no-rewards: "<red>There is no reward you can win on this wheel."
  free-used: "<green>Free spin used."
  busy: "<red>The wheel is spinning, wait a moment."
economy:
  missing: "<red>No economy system installed, the wheel cannot be spun."
  need-money: "<red>Spinning requires {amount}."
  need-xp: "<red>Spinning requires {amount} levels."
  need-ticket: "<red>This requires {amount}x {item}."
  payment-failed: "<red>Payment failed, please try again."
  refunded: "<yellow>The spin was interrupted, so your payment was refunded."
award:
  default: "<gold>☀</gold> <gray>You won:</gray> <reward>"
  broadcast: "<gold>☀ {player} <gray>won from the {wheel} wheel:</gray> <reward>"
preview:
  header: "<gold>{wheel}</gold> <gray>— rewards:</gray>"
  empty: "<gray>No enabled rewards.</gray>"
  row: "<reward> <gray>—</gray> <chance>{suffix}"
place:
  hint: "<gold>Right-click the block where you want to put the wheel. <gray>(cancel: /wheel cancel)"
  fail: "<red>Could not place the wheel here (it may be spinning or the id is taken)."
  done: "<green>Wheel placed: <white>{id}</white>. <gray>Edit it on the web: /wheel web"
command:
  only-ingame: "<red>This command is used in-game."
  create-usage: "<red>Usage (in-game): /wheel create <id>"
  move-usage: "<red>Usage (in-game): /wheel move <id>"
  bad-id: "<red>ID must be 1-32 chars: a-z, 0-9, -, _."
  id-taken: "<red>This id is already taken."
  cancelled: "<gray>Placement cancelled."
  no-placement: "<gray>No pending placement."
  remove-usage: "<red>Usage: /wheel remove <id>"
  no-wheel: "<red>No such wheel."
  deleted: "<green>Deleted."
  spinning-wait: "<red>The wheel is spinning right now; wait for it to finish."
  list-empty: "<gray>No wheels yet."
  list-line: "<gold>• <white>{id} <gray>{summary}"
  summary: "{style}, {duration} ticks, {rewards} rewards"
  spin-usage: "<red>Usage (in-game): /wheel spin <id>"
  spin-start: "<gray>Spinning..."
  spin-fail: "<red>The wheel is already spinning or has no rewards."
  set-usage: "<red>Usage: /wheel set <id> <{keys}> <value>"
  unknown-setting: "<red>Unknown setting."
  bad-value: "<red>Invalid value: {value}"
  updated: "<green>Updated."
  tune-current: "<gray>Now: text-pixel-blocks=<white>{a}</white> text-top-units=<white>{b}</white> text-line-units=<white>{c}</white> interpolation-ticks=<white>{d}</white>"
  tune-usage: "<red>Usage: /wheel tune <{keys}> <value>"
  tune-unknown: "<red>Unknown calibration value."
  tune-bad-number: "<red>Invalid number."
  tune-done: "<green>Calibration updated, wheels redrawn."
  angle-usage: "<red>Usage: /wheel angle <id> <degrees>"
  angle-none: "<red>The wheel has no visible rewards."
  angle-result: "<gray>Slice under the pointer (code): <white>{n}. {name}</white> <gray>— same slice visually?"
  reloaded: "<green>wheels.yml reloaded."
  web-off: "<red>Web API is off (config: web.enabled / web.port)."
  web-link: "<gold>Web editor link <gray>(valid 10 minutes, one use):</gray><newline><click:open_url:'{link}'><white>{link}</click>"
  web-manual: "<gold>Web editor:<newline><gray>1) Open: <white>http://YOUR-SERVER-IP:{port}/</white><newline>2) Paste this key on the login screen:</gray><newline><white>{token}</white>"
  web-guide: "<gray>Setup guide: <click:open_url:'{guide}'><white>{guide}</click>"
  give-usage: "<red>Usage: /wheel give <player> <wheel> <amount>"
  take-usage: "<red>Usage: /wheel take <player> <wheel> <amount>"
  bad-number: "<red>Invalid number."
  free-added: "<gold>{amount} free spin(s) {verb} for <white>{wheel}</white>. <gray>Balance: {left}."
  free-done: "<green>Done. <white>{player}</white> now has {left} free spin(s) on {wheel}."
  ticket-usage: "<red>Usage: /wheel ticket <give|take> <player> <wheel> <amount>"
  no-ticket: "<red>This wheel has no ticket item configured."
  ticket-done-player: "<gold>{amount}x ticket {verb} for <white>{wheel}</white>."
  ticket-done: "<green>Done."
  stats-usage: "<red>Usage: /wheel stats [player]"
  stats-header: "<gold>Stats for <white>{player}</white>:"
  stats-line: "<gray>• <white>{wheel}</white> spins: {spins}, wins: {wins}, free: {free}"
  reset-usage: "<red>Usage: /wheel resetcooldown <player> <wheel>"
  reset-done: "<green>Cooldown cleared."
  preview-usage: "<red>Usage (in-game): /wheel preview <id>"
  usage-line: "<gold>SunshineWheel</gold> <gray>/wheel {subs}<newline><gray>Edit wheels with: <white>/wheel web"
verb:
  added: "added"
  taken: "taken"
  given: "given"
