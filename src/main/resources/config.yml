# Interface language for in-game messages: en (English) or tr (Türkçe).
# The web editor is always English.
language: en

# Pixel text calibration. If a wheel looks shifted or wrongly sized in-game,
# adjust live with /wheel tune; values are saved here.
#
# text-pixel-blocks: world size of one font pixel at scale 1.
# text-top-units:    top edge of the image relative to the TextDisplay origin (font pixels).
# text-line-units:   height of one text line (font pixels); used to center the image.
text-pixel-blocks: 0.025
text-top-units: 3.0
text-line-units: 10.0

# How many ticks the client spreads each per-tick update over while spinning.
# Higher = smoother spin, but slightly more delayed.
interpolation-ticks: 3

# Web editor + API + resource pack, all on one embedded server (no extra setup).
# The editor UI is served from the jar itself at / (e.g. http://HOST:PORT/).
# bind: 0.0.0.0 = reachable directly (zero setup; open the port in your firewall).
#   127.0.0.1 = localhost only (use a reverse proxy for public HTTPS).
# Abuse protection (rate limits + login keys) is built in, but for a public
# server prefer the proxy for TLS — see examples/nginx-wheel.conf.
# public-url: base of the editor link shown by /wheel web (must end with /).
#   Blank = /wheel web prints the address + a paste-in key instead of a link.
#   Example behind nginx: "https://example.com/wheel/"
#   Example direct: "http://YOUR-SERVER-IP:8770/"
# guide-url: setup guide shown by /wheel web (blank = hidden).
web:
  enabled: true
  bind: 0.0.0.0
  port: 8770
  public-url: ""
  guide-url: "https://rehber.guldal.me/wheel-setup.html"

# Built-in resource pack (the 1x1 pixel font the wheel is drawn with).
# The plugin builds pack.zip on startup and serves it at /pack.zip on the same
# port as the web editor. Put the URL + sha1 (printed at startup) into
# server.properties as resource-pack / resource-pack-sha1, or merge
# assets/sunshinewheel from the served pack.zip into your own pack instead.
pack:
  enabled: true
