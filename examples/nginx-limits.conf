# SunshineWheel API rate limit: 10 requests/sec per IP, bursts of 20 allowed.
# Put this file in conf.d/ (http level, loaded before site configs), e.g.:
#   /etc/nginx/conf.d/wheel-limits.conf
# Defense in depth against auth brute-force and session abuse.
limit_req_zone $binary_remote_addr zone=wheel_api:10m rate=10r/s;
