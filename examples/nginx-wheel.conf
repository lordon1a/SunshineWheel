# SunshineWheel web editor: static UI + plugin API proxy.
# Include this file inside your site's server { ... } block (port 443),
# then: nginx -t && systemctl reload nginx
#
#   include /path/to/nginx-wheel.conf;
#
# Requires the rate-limit zone from nginx-limits.conf (http level, see that file).

location = /wheel {
    return 301 /wheel/;
}

location /wheel/api/ {
    limit_req zone=wheel_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8770/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}

location /wheel/ {
    # Serve the release's web/ folder here, e.g.:
    #   root /var/www;
    # ...so that /wheel/app.js maps to /var/www/wheel/app.js
    root /var/www;
    try_files $uri $uri/ /wheel/index.html;
    add_header Cache-Control "no-cache";
}
